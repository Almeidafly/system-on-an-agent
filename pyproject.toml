[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "system-on-an-agent"
version = "0.1.0"
description = "A complete system in one agent: planner as processor, memory and skills as storage, connectors as I/O."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joshua Almeida" }]
requires-python = ">=3.10"
keywords = ["agent", "planner", "memory", "skills", "connectors"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
soa = "soa.cli:main"

[project.urls]
Homepage = "https://github.com/fitzyracing1/system-on-an-agent"
Issues = "https://github.com/fitzyracing1/system-on-an-agent/issues"

[project.entry-points."soa.addons"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
